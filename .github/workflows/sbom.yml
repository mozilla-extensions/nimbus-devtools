name: ssdlc-sbom

on:
  release:
    types: [published]
  push:
    tags:
      - "release/**"
  workflow_dispatch:

permissions: {}

jobs:
  sbom:
    permissions:
      actions: read
      contents: write
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@8349e1f049837759d6a5f709c459b5f2efa6a403
    with:
      sbom_name: ${{ github.event.release.tag_name || github.sha }}
