name: ssdlc-sbom

on:
  release:
    types: [published]
  push:
    tags:
      - "release/**"
  workflow_dispatch:

permissions: {}

jobs:
  sbom:
    permissions:
      actions: read
      contents: write
    uses: mozilla/ssdlc-actions/.github/workflows/ssdlc-sbom.yml@dea789d28210f84655a41be4ac02c384e1aac72a
    with:
      sbom_name: ${{ github.event.release.tag_name || github.sha }}
